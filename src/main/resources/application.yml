spring:
  application:
    name: pi-spring-ai
  ai:
    model:
      chat: ${AGENT_MODEL_PROVIDER:google-genai}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_MODEL:gpt-4.1-mini}
    mcp:
      client:
        enabled: ${AGENT_MCP_ENABLED:false}
        type: SYNC
        request-timeout: ${AGENT_MCP_REQUEST_TIMEOUT:20s}
      server:
        enabled: ${AGENT_MCP_SERVER_ENABLED:false}
        name: pi-spring-ai
        version: 0.0.1-SNAPSHOT
        protocol: STREAMABLE
        type: SYNC
        request-timeout: ${AGENT_MCP_SERVER_REQUEST_TIMEOUT:35s}
        tool-callback-converter: true
        expose-mcp-client-tools: false
        annotation-scanner:
          enabled: false
        capabilities:
          resource: false
          tool: true
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

server:
  address: ${SERVER_ADDRESS:127.0.0.1}

agent:
  workspace:
    root: .
    max-read-bytes: 200000
    max-directory-entries: 200
    max-grep-matches: 100
  tools:
    write-enabled-by-default: false
    bash-enabled-by-default: false
    bash-timeout-seconds: 30
    max-tool-output-chars: 20000
  session:
    root: .pi-spring-ai/sessions
  model:
    provider: ${AGENT_MODEL_PROVIDER:google-genai}
    name: ${AGENT_MODEL_NAME:${GEMINI_MODEL:gemini-2.5-flash}}
  mcp:
    allowed-tools: ${AGENT_MCP_ALLOWED_TOOLS:}
    server:
      exposed-tools: ${AGENT_MCP_SERVER_EXPOSED_TOOLS:ls,read,find,grep}
      allow-write: ${AGENT_MCP_SERVER_ALLOW_WRITE:false}
      allow-bash: ${AGENT_MCP_SERVER_ALLOW_BASH:false}
